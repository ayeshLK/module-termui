name: GraalVM Check

# Runs the package's tests as a GraalVM native image. This is a v1 goal and is not a required check:
# a failure is visible here but does not block merging or releasing.
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "30 18 1 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Test with GraalVM native image
    runs-on: ubuntu-22.04
    # Add the "Skip GraalVM Check" label to a pull request to opt out.
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'Skip GraalVM Check') }}
    env:
      packageUser: ${{ github.actor }}
      packagePAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ballerina
        id: setup
        uses: ./.github/actions/setup-build
        with:
          install-ballerina: "true"
          install-jdk: "false"

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          java-version: ${{ steps.setup.outputs.java-version }}
          distribution: graalvm-community
          set-java-home: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the GraalVM installation
        run: native-image --version

      - name: Build the package
        run: ./gradlew build

      - name: Remove the JVM build output
        run: rm -rf ballerina/target

      # The tty group needs a pseudo-terminal helper that is not part of the native check.
      - name: Test with GraalVM
        working-directory: ballerina
        run: bal test --graalvm --disable-groups tty

      - name: Publish the package to the local repository
        working-directory: ballerina
        run: |
          bal pack
          bal push --repository=local

      # The examples use the published package; test them against the code in this commit instead.
      - name: Point the examples at the package built here
        run: .github/scripts/point-examples-at-source.sh

      # Building an example natively shows whether a real application can ship as a native image.
      - name: Build the agent harness as a native image
        working-directory: examples/agent-harness
        run: bal build --graalvm

      # A build alone does not show that the binary works: run it with no terminal and check the result.
      - name: Run the native agent harness headless
        working-directory: examples/agent-harness
        run: |
          started=$(date +%s%N)
          ./target/bin/agent_harness < /dev/null > native-output.txt
          finished=$(date +%s%N)
          echo "native run took $(( (finished - started) / 1000000 )) ms"
          cat native-output.txt
          grep -q "Welcome to Dummy Agent" native-output.txt
          ! grep -q $'\x1b' native-output.txt
