name: Publish to the Ballerina Dev/Stage Central

# Publishes a development version to the Dev or Stage Central. It never tags or releases.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Select the environment
        required: true
        options:
          - DEV CENTRAL
          - STAGE CENTRAL

permissions:
  contents: read

jobs:
  publish:
    name: Publish to ${{ inputs.environment }}
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ayeshLK'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          install-ballerina: "true"

      - name: Drop the -SNAPSHOT suffix
        run: sed -i 's/^version=\(.*\)-SNAPSHOT/version=\1/' gradle.properties

      - name: Publish to Ballerina Dev Central
        if: ${{ inputs.environment == 'DEV CENTRAL' }}
        env:
          BALLERINA_DEV_CENTRAL: "true"
          BALLERINA_STAGE_CENTRAL: "false"
          BALLERINA_CENTRAL_ACCESS_TOKEN: ${{ secrets.BALLERINA_CENTRAL_DEV_ACCESS_TOKEN }}
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BALLERINA_BOT_TOKEN }}
        run: ./gradlew clean build -PpublishToCentral=true

      - name: Publish to Ballerina Stage Central
        if: ${{ inputs.environment == 'STAGE CENTRAL' }}
        env:
          BALLERINA_DEV_CENTRAL: "false"
          BALLERINA_STAGE_CENTRAL: "true"
          BALLERINA_CENTRAL_ACCESS_TOKEN: ${{ secrets.BALLERINA_CENTRAL_STAGE_ACCESS_TOKEN }}
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BALLERINA_BOT_TOKEN }}
        run: ./gradlew clean build -PpublishToCentral=true
