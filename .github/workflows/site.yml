name: Documentation site

# Builds the documentation site and compiles the examples its pages include. Pull requests that touch
# the site, the examples or this workflow run the checks; pushes to main publish to GitHub Pages.
# Package-only changes do not run it, so they do not pay for Node.
on:
  pull_request:
    paths:
      - "site/**"
      - "examples/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "examples/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  site:
    name: Build the site
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # The model behind the interactive loop diagram, and a check that the counter it mirrors has not changed.
      - name: Test
        working-directory: site
        run: npm test

      - name: Build
        working-directory: site
        run: npm run build

      # Every internal link and #fragment in the built site must resolve.
      - name: Check links
        working-directory: site
        run: npm run check-links

      - name: Upload the site
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  examples:
    name: Compile the included examples
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          install-ballerina: "true"

      # Each example is built against the termui version it pins, as a reader of the site would.
      - name: Build and test the examples
        run: examples/check.sh

  deploy:
    name: Publish to GitHub Pages
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [site, examples]
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
