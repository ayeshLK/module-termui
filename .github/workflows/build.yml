name: Build and test

# Reusable build used by the pull-request and main-branch workflows.
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    env:
      packageUser: ${{ github.actor }}
      packagePAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          install-ballerina: "true"

      # Build and test run separately: the Ballerina Gradle plugin only supports test-group
      # selection with `gradlew test`, not with `gradlew build`.
      - name: Build
        run: ./gradlew build -x test

      - name: Test (default group)
        run: ./gradlew test

      - name: Test (tty group, real pseudo-terminal)
        run: ./gradlew test -Pgroups=tty

      # The example uses the package the way a consumer would: from the local repository.
      - name: Publish the package to the local repository
        working-directory: ballerina
        run: |
          bal pack
          bal push --repository=local

      # The examples use the published package; test them against the code in this commit instead.
      - name: Point the examples at the package built here
        run: .github/scripts/point-examples-at-source.sh

      # The harness check feeds the app's output to a terminal emulator to look at the screen.
      - name: Install pyte (terminal emulator for the harness check)
        run: python3 -m pip install pyte==0.8.2

      - name: Build and verify the agent harness
        working-directory: examples/agent-harness
        run: |
          bal build
          JAVA="$(command -v java)" python3 verify.py

      # The README's quickstart is this example: building it keeps the documentation honest.
      - name: Build and verify the counter (README quickstart)
        working-directory: examples/counter
        run: |
          bal build
          JAVA="$(command -v java)" python3 verify.py

      - name: Upload coverage
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
